ожет пройти до записи. Коммерческая гипотеза — больше подходящих обращений. Публичная версия не содержит количественных целей и обещаний продаж.", "status": "Гипотеза — не проверена", "source": "", "sourceLabel": "", "sources": []}]}, "brief.offer": {"title": "Исходное предложение", "path": "", "summary": "Существующая услуга — индивидуальная консультация взрослого онлайн или очно. Продукт пока не выбран.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Starting Description — предложение", "text": "Психологические консультации: КПТ и включённый человеческий контакт. Принятый фокус — границы, собственная ценность и право ошибаться; остальные заявленные запросы практики не исключены.", "status": "Принято согласно экспресс-сборке; формат — со слов Ольги", "source": "", "sourceLabel": "", "sources": []}, {"title": "Main Offers — действующее и задуманное", "text": "Опубликованные 30.09.2026 цены: очная консультация 3 000 ₽, онлайн 2 500 ₽; Taplink и DIKIDI также указывают 60 минут для обеих услуг. Фактическая доступность, оплата и условия переносов не проверены.", "status": "Наблюдение публичного материала; внутренний процесс не проверен; будущий продукт — открыто", "source": "", "sourceLabel": "", "sources": []}, {"title": "Связь с архитектурой услуг", "text": "Исходный Brief фиксирует сообщение о предложении. Его рабочая структура и границы находятся в Service System / Offer Architecture; новые тарифы здесь не разрабатываются.", "status": "Правило хранения", "source": "", "sourceLabel": "", "sources": []}]}, "brief.inputs": {"title": "Условия работы", "path": "", "summary": "Внутренние сведения этого модуля не входят в демонстрацию.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": []}, "brief": {"title": "Бриф", "path": "", "summary": "Привлечение на действующие консультации.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Текущее положение", "text": "Привлечение на действующие консультации.", "status": "Сводка с сохранением статусов в подмодулях", "source": "", "sourceLabel": "", "sources": []}, {"title": "Контекст — Ольга Юферева", "text": "Психологическая практика для взрослых. Проект: перенести основания в новый Atlas и подготовить проверяемый путь к записи на действующие консультации.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}, {"title": "Исходное предложение", "text": "Существующая услуга — индивидуальная консультация взрослого онлайн или очно. Продукт пока не выбран.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}]}, "audit.identity": {"title": "Аудит идентичности", "path": "", "summary": "Публичный профиль доступен. Текущая визуальная система ещё не описана и не проверена; принятый характер — намерение, а не результат аудита.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Существующая система", "text": "В заголовке профиля видны имя Ольги и форматы «очно и онлайн». В био выделена тема привычки быть удобной и чувства вины. Названия Highlights структурированы по темам: подход, запросы, консультация, частые вопросы, отзывы, запись; рядом личные темы. Это наблюдение шапки, не полный визуальный аудит.", "status": "Наблюдение публичного материала", "source": "", "sourceLabel": "", "sources": []}, {"title": "Что характеризует систему", "text": "Можно наблюдать организованное представление специалиста и тематические входы. Читаемость всех карточек, палитра, шрифты, графический принцип, последовательность материалов и узнаваемость ещё не проверены.", "status": "Наблюдение публичного материала; предел проверки", "source": "", "sourceLabel": "", "sources": []}, {"title": "Разрывы и непроверенное", "text": "Не объявляем отсутствие разработанной айдентики недостатком действующего аккаунта. Визуальные исходники, знак и права не просмотрены. Тепло, искренность и ясность из Express — принятая цель подачи; соответствие реальных материалов этой цели требует сравнения.", "status": "Открыто", "source": "", "sourceLabel": "", "sources": []}]}, "audit.messaging": {"title": "Аудит сообщений", "path": "", "summary": "Био уже выражает фокус на привычке быть удобной. Работоспособность сообщений и интерпретация аудиторией неизвестны.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Существующие сообщения", "text": "В публичном био наблюдаются обещание прикладных инструментов для повседневной жизни и помощь с привычкой быть удобной и чувством вины. Формулировки соответствуют тематическому фокусу Express; это ещё не подтверждение результата помощи.", "status": "Наблюдение публичного материала", "source": "", "sourceLabel": "", "sources": []}, {"title": "Сверка с Brief", "text": "Тематическая связь с выбранной ситуацией уже присутствует. Гипотеза «клиентам непонятно, с чем работает Ольга» не может считаться установленной только потому, что обращений мало. Проверяем конкретные материалы и путь до условий.", "status": "Интерпретация наблюдения", "source": "", "sourceLabel": "", "sources": []}, {"title": "Claims / Proof — утверждения и подтверждения", "text": "Taplink публично называет диплом КГПУ им. В. П. Астафьева и членство в ассоциации; документы и членство независимо не проверены. DIKIDI добавляет элементы гештальт-подхода к КПТ. В Taplink есть уверенная конструкция «где вы научитесь» перед желаемыми изменениями: её стоит сверить с принятой границей отсутствия одинакового обещания всем. Это редакторское наблюдение, не заключение об эффективности помощи или законности постов.", "status": "Наблюдение публичного материала; внутренний процесс не проверен", "source": "", "sourceLabel": "", "sources": []}, {"title": "Ограничение аудита", "text": "Полные тексты постов, Highlights и отзывы ещё не разобраны. Не выдаём аудит шапки за анализ всей коммуникации или рекламную квалификацию конкретных публикаций.", "status": "Открыто", "source": "", "sourceLabel": "", "sources": []}]}, "audit.channels": {"title": "Каналы и материалы", "path": "", "summary": "Наблюдены Instagram, Taplink и DIKIDI. Два публичных пути записи уже существуют, их вклад неизвестен.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Instagram", "text": "Пользователь предоставил @olyayuferevaa. Публично видны шапка, категории Highlights, сетка фото/каруселей и видео. На просмотре 29–30.09.2026 отображалось 771 подписчик; это наблюдаемый счётчик, не охват, спрос или активные клиенты.", "status": "Наблюдение публичного материала", "source": "", "sourceLabel": "", "sources": []}, {"title": "Taplink", "text": "В меню Instagram доступны «Информация • стоимость • запись» → Taplink и «Самостоятельная онлайн-запись» → DIKIDI. Taplink содержит ситуации обращения, описание специалиста/условий, цены и кнопку Telegram. DIKIDI содержит две услуги и интерфейс самостоятельной записи. Это существующая инфраструктура, не наш новый проект.", "status": "Наблюдение публичного материала; внутренний процесс не проверен", "source": "", "sourceLabel": "", "sources": []}, {"title": "Рекомендации", "text": "Рекомендации рассматриваем как возможный самостоятельный вход. Неизвестно, идут ли они от клиентов или коллег и какую долю записей дают. Где человек написал, не всегда равно тому, где впервые узнал.", "status": "Со слов Ольги — по экспресс-сборке; последнее — аналитическое различие", "source": "", "sourceLabel": "", "sources": []}, {"title": "Материалы и пробелы", "text": "Отзывы представлены галереей в Taplink, но их содержание и права не проверены. В DIKIDI на просмотре отзывов нет; это характеристика данной карточки, не отсутствие отзывов у Ольги вообще. Образовательные документы, внутренняя аналитика и история обращений не просмотрены. Нельзя приписывать рекомендации Instagram по последнему месту сообщения.", "status": "Наблюдение публичного материала; внутренний процесс не проверен; внутренние сведения — открыто", "source": "", "sourceLabel": "", "sources": []}]}, "audit.offer": {"title": "Представление услуги", "path": "", "summary": "На Taplink и DIKIDI видны форматы, 60 минут и цены 3 000/2 500 ₽. Отдельно доступны самостоятельная запись и обращение в Telegram.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Что видно при выборе", "text": "Taplink объясняет ситуации обращения, представляет психолога, указывает онлайн/очно, цены и длительность, предлагает обратиться через Telegram. DIKIDI показывает две услуги, специалиста и действие записи. Полные правила оплаты, отмены и фактической доступности не проверены.", "status": "Наблюдение публичного материала; внутренний процесс не проверен", "source": "", "sourceLabel": "", "sources": []}, {"title": "Что требуется проверить", "text": "Проверить понимание границ консультации и выбора между двумя способами записи, реальные вопросы людей, оплату и переносы. В Taplink заголовок «Стоимость услуг» отображается как ссылка с адресом http/; цены ниже доступны, поэтому основной обрыв этим не доказан. Техническую ссылку можно точечно исправить при согласованном редактировании.", "status": "Наблюдение + предложение проверки", "source": "", "sourceLabel": "", "sources": []}]}, "audit.touchpoints": {"title": "Точки контакта", "path": "", "summary": "Видны маршруты профиль → DIKIDI и профиль → Taplink → Telegram. Фактическая запись, ответ, оплата и встречи не тестировались.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Наблюдаемые входы", "text": "Профиль предлагает два отдельных входа. Через Taplink можно прочитать условия и перейти в Telegram; через DIKIDI — выбрать карточку онлайн/очной услуги. Открыта карточка онлайн-консультации: видны цена, 60 минут и специалист. Время не резервировалось, заявка не отправлялась.", "status": "Наблюдение публичного материала; внутренний процесс не проверен", "source": "", "sourceLabel": "", "sources": []}, {"title": "Переходы и возможное трение", "text": "Существуют два публичных маршрута, но неизвестны их реальные роли и потери. Два варианта не считаются ошибкой: возможно, они обслуживают разную готовность человека. Подтверждение времени, ответ, оплата, переносы и причины отказов пока не наблюдались.", "status": "Наблюдение публичного материала; внутренний процесс не проверен; роль маршрутов — гипотеза", "source": "", "sourceLabel": "", "sources": []}, {"title": "Следующая проверка", "text": "Восстановить шаги на примере обезличенного процесса записи и доступных агрегатов обращений. Не собирать клиническое содержание и не запускать тестовую заявку от имени потенциального клиента.", "status": "Предложение — не согласовано", "source": "", "sourceLabel": "", "sources": []}, {"title": "Граница с целевым путём", "text": "Предлагаемый будущий маршрут находится в Service Journey. Здесь фиксируется существующее взаимодействие, не идеальная воронка.", "status": "Правило хранения", "source": "", "sourceLabel": "", "sources": []}]}, "audit": {"title": "Аудит", "path": "", "summary": "Интервью дополнено ограниченным просмотром публичного профиля. Полный путь записи и эффективность ещё не проверены.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Текущее положение", "text": "Интервью дополнено ограниченным просмотром публичного профиля. Полный путь записи и эффективность ещё не проверены.", "status": "Сводка с сохранением статусов в подмодулях", "source": "", "sourceLabel": "", "sources": []}, {"title": "Аудит идентичности", "text": "Публичный профиль доступен. Текущая визуальная система ещё не описана и не проверена; принятый характер — намерение, а не результат аудита.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}, {"title": "Аудит сообщений", "text": "Био уже выражает фокус на привычке быть удобной. Работоспособность сообщений и интерпретация аудиторией неизвестны.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}, {"title": "Каналы и материалы", "text": "Наблюдаем Instagram и Taplink; рекомендации рассматриваем как иной возможный вход. Их вклад в записи пока не измерен.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}, {"title": "Представление услуги", "text": "В профиле понятны профессия и онлайн/очный формат. Полноту условий и механизм записи проверяем по связанной странице.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}, {"title": "Точки контакта", "text": "Instagram и рекомендации рассматриваются как возможные входы. Реальный путь обращения, оплаты и первой встречи пока не восстановлен.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}]}, "research.audience": {"title": "Аудитория и ситуация", "path": "", "summary": "Рабочий фокус — взрослый человек, привыкший подстраиваться под других и с трудом учитывающий себя. Рыночная распространённость не проверена.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Группа и роль", "text": "Взрослый человек, потенциальный пользователь индивидуальной консультации. Фокус принят по Express; пол, возрастной диапазон и доход не заданы. Женский род в нынешнем био — наблюдение языка профиля, не согласованное ограничение аудитории только женщинами.", "status": "Принято согласно экспресс-сборке; наблюдение био отдельно", "source": "", "sourceLabel": "", "sources": []}, {"title": "Ситуация и триггер", "text": "По рассказу Ольги, самостоятельные попытки не помогают; человек замечает повторение/ухудшение ситуации и бессилие. Отношения с близкими или работа, сравнение с другими — обобщение из рассказа, а не установленный общий паттерн.", "status": "Со слов Ольги — по экспресс-сборке; контекст — гипотеза", "source": "", "sourceLabel": "", "sources": []}, {"title": "Потребность / задача", "text": "Научиться учитывать себя в отношениях и действовать с большей опорой на собственные потребности. Желаемые изменения: границы, признание своих переживаний, право ошибаться. Это принятый рабочий смысл, не гарантированный исход консультации.", "status": "Принято согласно экспресс-сборке", "source": "", "sourceLabel": "", "sources": []}, {"title": "Барьеры", "text": "Самостоятельные попытки до обращения — со слов Ольги. Страх конфликта, отвержения или вины — гипотезы; прямые ответы клиентов не получены.", "status": "Со слов Ольги — по экспресс-сборке; страхи — гипотеза", "source": "", "sourceLabel": "", "sources": []}, {"title": "Альтернативы", "text": "Известны самостоятельные попытки. Другие способы, отказ от помощи и выбор конкретных специалистов не исследованы.", "status": "Со слов Ольги — по экспресс-сборке", "source": "", "sourceLabel": "", "sources": []}]}, "research.market": {"title": "Рынок и альтернативы", "path": "", "summary": "Рыночное сравнение предложений Ольги ещё не проведено. Проверка каналов не заменяет исследование конкурентов.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Границы исследования", "text": "В Express системного сравнения рынка нет. Сейчас выполняется узкая проверка способов доступа к клиентам, а не доказательство рыночной ниши или спроса.", "status": "Открыто", "source": "", "sourceLabel": "", "sources": []}, {"title": "Известные альтернативы", "text": "Самостоятельное решение — исходный кандидат альтернативы. Не определены конкретные игроки, их цены, обещания и подтверждения. Не переносим в проект выдуманный рейтинг конкурентов.", "status": "Со слов Ольги — по экспресс-сборке; сравнение — открыто", "source": "", "sourceLabel": "", "sources": []}, {"title": "Следующий достаточный шаг", "text": "После выбора географии и приоритетной услуги сравнить несколько реально рассматриваемых человеком альтернатив по ситуации, формату, доверию и записи. Объём определяется вопросом, не обязательным количеством карточек.", "status": "Предложение — не согласовано", "source": "", "sourceLabel": "", "sources": []}, {"title": "Что не следует из поиска каналов", "text": "Наличие карт или каталога психологов означает возможность размещения при соблюдении условий сервиса, не доказанный спрос на Ольгу. См. отдельное ограниченное исследование каналов.", "status": "Ограничение вывода", "source": "", "sourceLabel": "", "sources": []}]}, "research.domain": {"title": "Контекст сферы", "path": "", "summary": "Психологическое содержание проверяет Ольга. Для российской географии рекламное применение Instagram ограничено законом; конкретные материалы отдельно квалифицируются.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Устройство сферы и терминология", "text": "Работа со взрослыми, КПТ, онлайн/очно — заявленные сведения о практике. В этом проекте не разрабатывается протокол психологической помощи и не оценивается эффективность лечения. Профессиональные термины и содержание публичных материалов проверяет Ольга.", "status": "Со слов Ольги — по экспресс-сборке; граница проекта", "source": "", "sourceLabel": "", "sources": []}, {"title": "Нормы и условия коммуникации", "text": "Не обещать одинаковый результат всем и не представлять пересказ одного случая как типичный эффект. Согласия на публикацию клиентских материалов не установлены. Это следует из ограничений данных; правовые и профессиональные требования конкретного формата проверяются перед его выпуском.", "status": "Граница имеющихся оснований", "source": "", "sourceLabel": "", "sour e": "", "sourceLabel": "", "sources": []}, {"title": "Достаточная следующая проверка", "text": "После выбора применения сопоставить подходящие референсы и проверить одно визуальное направление на реальном содержании. Оценивать читаемость и характер, а не число красивых макетов.", "status": "Предложение — не согласовано", "source": "", "sourceLabel": "", "sources": []}]}, "research.synthesis": {"title": "Синтез оснований", "path": "", "summary": "Не начинать с объёма контента: сначала связать существующее предложение, доверие и запись.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Вывод 1 — фокус уже есть", "text": "Наблюдение: Express выделяет ситуацию «быть удобным»; публичное био уже говорит на эту тему. Интерпретация: начинать с изобретения нового фокуса без проверки текущего пути преждевременно. Значение: проверить переход к условиям и записи. Ограничение: понимание аудиторией и конверсия неизвестны.", "status": "Синтез наблюдения и источника; гипотеза действия", "source": "", "sourceLabel": "", "sources": []}, {"title": "Вывод 2 — контакт как опора", "text": "Основание: вывод из практики Ольги. Возможность: показывать Ольгу и объяснять процесс; это может снижать неопределённость. Ограничение: отдельный случай не доказывает уникальность или предпочтение всей аудитории.", "status": "Гипотеза — не проверена", "source": "", "sourceLabel": "", "sources": []}, {"title": "Вывод 4 — не только Instagram", "text": "Instagram и рекомендации рассматриваются как два возможных входа. Публично уже существуют Taplink → Telegram и отдельный DIKIDI. Следствие: сначала проверить согласованность и работу имеющихся путей; создавать новый лендинг по умолчанию не требуется. Два маршрута могут быть полезны разным людям — это гипотеза. Доли каналов и потери до записи неизвестны.", "status": "Синтез источника и наблюдения; следующий выбор — предложение", "source": "", "sourceLabel": "", "sources": []}]}, "research": {"title": "Исследование", "path": "", "summary": "Различаем сведения интервью, публичные наблюдения и новые гипотезы. Рыночное и визуальное исследование не имитируем.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Текущее положение", "text": "Различаем сведения интервью, публичные наблюдения и новые гипотезы. Рыночное и визуальное исследование не имитируем.", "status": "Сводка с сохранением статусов в подмодулях", "source": "", "sourceLabel": "", "sources": []}, {"title": "Аудитория и ситуация", "text": "Рабочий фокус — взрослый человек, привыкший подстраиваться под других и с трудом учитывающий себя. Рыночная распространённость не проверена.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}, {"title": "Рынок и альтернативы", "text": "Рыночное сравнение предложений Ольги ещё не проведено. Проверка каналов не заменяет исследование конкурентов.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}, {"title": "Контекст сферы", "text": "Психологическое содержание проверяет Ольга. Для российской географии рекламное применение Instagram ограничено законом; конкретные материалы отдельно квалифицируются.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}, {"title": "Визуальное исследование", "text": "Поле визуальных альтернатив и референсы не исследованы. Принятое направление нельзя выдавать за готовый язык.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}, {"title": "Синтез оснований", "text": "Не начинать с объёма контента: сначала связать существующее предложение, доверие и запись.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}]}, "core.mission": {"title": "Миссия", "path": "", "summary": "Отдельная миссия в Express не утверждена. Есть внутренний мотив и принятая центральная идея; они не переименованы в миссию автоматически.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Какой вклад создаёт бренд", "text": "Ольга ценит вклад в жизнь людей и видимые изменения; это внутренний мотив со слов Ольги. Отдельная миссия не была утверждена.", "status": "Со слов Ольги — по экспресс-сборке; миссия — открыто", "source": "", "sourceLabel": "", "sources": []}, {"title": "Кому адресован вклад", "text": "Принятый фокус — взрослые, привыкшие подстраиваться под других. Размещение этого материала в форме миссии не является утверждением новой формулировки.", "status": "Принято согласно экспресс-сборке; классификация — рабочая", "source": "", "sourceLabel": "", "sources": []}, {"title": "Проявление в практике", "text": "Есть выводы из практики и принятые принципы работы. Они помогают обсуждать миссию, но не доказывают достигнутый вклад для всех клиентов.", "status": "Со слов Ольги — по экспресс-сборке", "source": "", "sourceLabel": "", "sources": []}, {"title": "Итог для платформы", "text": "Миссия открыта. Её отсутствие не мешает первой пробе пути к консультации: используем уже принятые принципы, фокус и центральную идею.", "status": "Открыто; продолжение опыта — предложение", "source": "", "sourceLabel": "", "sources": []}]}, "core.vision": {"title": "Видение", "path": "", "summary": "Внутренние сведения этого модуля не входят в демонстрацию.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": []}, "core.values": {"title": "Принципы выбора", "path": "", "summary": "Приняты: конкретный опыт человека, узнаваемые ситуации без оценки, структура с чуткостью и связь работы с жизнью. Новые ограничения и конкретные способы исполнения ниже отмечены как предложения.", "templatePath": "", "templateStatus": "Адаптация существующей универсальной формы под Ольгу", "sections": [{"title": "Конкретный опыт человека", "text": "Приняты принцип разбираться в конкретном опыте и направление показывать узнаваемые ситуации без оценки человека. Наше уточнение: не ставить диагноз по посту и давать человеку возможность проверить релевантность темы. Граница: не подменять конкретику универсальным обещанием. Проверка: текст описывает ситуацию, а не оценивает человека.", "status": "Принцип и направление — принято согласно экспресс-сборке; новые ограничения и исполнение — предложение", "source": "", "sourceLabel": "", "sources": []}, {"title": "Структура и чуткость", "text": "Принято сочетать порядок с включённым человеческим контактом и ясно объяснять процесс и условия. Предлагаемое следствие: организационная автоматизация возможна, но её сообщения не должны изображать индивидуальную психологическую помощь. Антипринцип из Express — отстранённое/шаблонное обращение.", "status": "Принято согласно экспресс-сборке; следствия — предложение", "source": "", "sourceLabel": "", "sources": []}, {"title": "Связь с изменениями в жизни", "text": "Принято связывать работу с жизнью человека. Предлагаемое следствие: объяснять задачи помощи на конкретных ситуациях. Граница: не обещать одному человеку результат из рассказа о другом.", "status": "Принято согласно экспресс-сборке; следствия — предложение", "source": "", "sourceLabel": "", "sources": []}, {"title": "Согласование", "text": "Сохраняем статус «принято согласно Express v0.1». Первичный разговор не прочитан; дата каждого отдельного принятия неизвестна. Практика соблюдения принципов не проверена этим переносом.", "status": "Ограничение источника", "source": "", "sourceLabel": "", "sources": []}]}, "core.superidea": {"title": "Центральная идея", "path": "", "summary": "«Учитывать себя в отношениях с другими» — принятая рабочая основа. Её размещение в Super Idea — проектная классификация.", "templatePath": "", "templateStatus": "Проектная адаптация кандидатного каркаса v7; универсальная форма ещё не утверждена", "sections": [{"title": "Central юдены два действующих публичных пути. Предлагаем сохранить возможность прочитать условия/задать вопрос и возможность записаться самостоятельно; затем проверить, понимает ли человек разницу. Базой может быть существующий Taplink, а не новый сайт. Подготовка и членство заявлены публично, документы не проверены.", "status": "Наблюдение + предложение целевого использования", "source": "", "sourceLabel": "", "sources": []}, {"title": "Обращение и запись", "text": "Для вопросов опубликован Telegram, для самостоятельной записи — DIKIDI с карточками услуг. Нужно выяснить реальный выбор людей, свободные слоты, подтверждение, оплату и переносы. Не называть эти два пути работающей воронкой без данных о прохождении.", "status": "Наблюдение публичного материала; внутренний процесс не проверен; процесс после выбора — открыто", "source": "", "sourceLabel": "", "sources": []}, {"title": "Первая встреча", "text": "Профессиональное содержание определяет Ольга. Для коммуникации важно, что человеку нужно знать заранее и как начинается согласованная услуга; детали не выдумываем.", "status": "Открыто", "source": "", "sourceLabel": "", "sources": []}, {"title": "Проверка пути", "text": "До запуска — понимание предложения/условий и отсутствие обрыва перехода. После запуска — фактические обращения и записи. Охват рассматриваем отдельно от новых клиентов.", "status": "Предложение — не согласовано", "source": "", "sourceLabel": "", "sources": []}]}, "service": {"title": "Услуга и взаимодействие", "path": "", "summary": "Консультации существуют; подробные условия и фактический путь записи уточняются.", "templatePath": "", "templateStatus": "Проектная адаптация кандидатного каркаса v7; универсальная форма ещё не утверждена", "sections": [{"title": "Текущее положение", "text": "Консультации существуют; подробные условия и фактический путь записи уточняются.", "status": "Сводка с сохранением статусов в подмодулях", "source": "", "sourceLabel": "", "sources": []}, {"title": "Архитектура предложения", "text": "Сейчас — консультации онлайн/очно.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}, {"title": "Правила взаимодействия", "text": "Ясность и уважение к выбору переводятся в условия и человеческий ответ. Конкретный процесс пока предложен, а не наблюдён.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}, {"title": "Путь к консультации", "text": "Проектная схема: знакомство → понимание специалиста и условий → обращение → запись → первая встреча. Это предложение, не проверенная воронка.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}]}, "external.messaging": {"title": "Система сообщений", "path": "", "summary": "Рабочий смысл — учитывать себя в отношениях. Публичные формулировки должны объяснять существующую консультацию, а не обещать одинаковое изменение всем.", "templatePath": "", "templateStatus": "Проектная адаптация кандидатного каркаса v7; универсальная форма ещё не утверждена", "sections": [{"title": "Key Message", "text": "Принятая основа: «Учитывать себя в отношениях с другими». Это смысловое основание; готовый рекламный слоган и клиническое обещание из него автоматически не следуют.", "status": "Принято согласно экспресс-сборке", "source": "", "sourceLabel": "", "sources": []}, {"title": "Supporting Messages / Hierarchy", "text": "Предложенная последовательность: узнаваемая ситуация → кто Ольга и как работает → конкретные условия → следующий шаг. Основания доверия добавляются только после проверки материала.", "status": "Предложение — не согласовано", "source": "", "sourceLabel": "", "sources": []}, {"title": "Themes / Narratives", "text": "Границы, собственная ценность, право ошибаться, конкретный опыт человека. Пример Express о согласии помочь без сил — сочинённая иллюстрация темы, не цитата клиента.", "status": "Принято согласно экспресс-сборке; примеры — предложения", "source": "", "sourceLabel": "", "sources": []}, {"title": "Claims / Proof References", "text": "Не обещать одинаковый результат всем; не выводить уникальность из КПТ или эмпатии; не публиковать пересказ случая как отзыв. Ссылки на подтверждения — Audit и Differentiation.", "status": "Граница оснований", "source": "", "sourceLabel": "", "sources": []}, {"title": "CTA", "text": "Функция следующего шага: узнать условия и обратиться по поводу записи. Точная фраза и место определяются после аудита и учёта правил площадки. Кнопка/призыв не назначены каждому материалу.", "status": "Предложение — не согласовано", "source": "", "sourceLabel": "", "sources": []}, {"title": "SMP Reference", "text": "Единственная главная коммуникационная мысль выводится из выбранного позиционирования. Отдельная финальная SMP не согласована; не дублируем центральную идею под новым статусом.", "status": "Открыто", "source": "", "sourceLabel": "", "sources": []}]}, "external.verbal": {"title": "Голос и речь", "path": "", "summary": "Прямо, понятно, тепло и без оценивания человека. Юмор допустим; тон не заменяет точность условий.", "templatePath": "", "templateStatus": "Проектная адаптация кандидатного каркаса v7; универсальная форма ещё не утверждена", "sections": [{"title": "Tone / Speech Character", "text": "Участие, искренность, тепло, ясность, живой контакт; юмор уместен. Прямой понятный голос; конкретные ситуации и объяснение процесса.", "status": "Принято согласно экспресс-сборке", "source": "", "sourceLabel": "", "sources": []}, {"title": "Vocabulary / Syntax", "text": "Предлагаем обычные слова, а профессиональный термин поясняем по необходимости. Не выдаём клиническое обобщение за знание конкретного читателя. Авторский устный материал Ольги — возможный источник её интонации.", "status": "Предложение — не согласовано", "source": "", "sourceLabel": "", "sources": []}, {"title": "Do / Don’t", "text": "Разбирать ситуацию без обвинения. Пример несоответствия из Express: «Вы сами позволяете собой пользоваться» — оценивание человека. Ясное объяснение формата соответствует направлению; обещание результата каждому — нет.", "status": "Внутренняя проверка из Express", "source": "", "sourceLabel": "", "sources": []}, {"title": "Контекст и язык", "text": "Исходный язык русский. Формат текста, видео и ответа может различаться, сохраняя отношение к человеку. Английский, другие языки и международное позиционирование не назначены.", "status": "Со слов Ольги — по экспресс-сборке; адаптация — предложение", "source": "", "sourceLabel": "", "sources": []}]}, "external.visual": {"title": "Визуальная система", "path": "", "summary": "Принято направление, а не готовая айдентика: ясность, тепло, порядок, естественные фотографии. Средства предстоит выбрать на реальных применениях.", "templatePath": "", "templateStatus": "Проектная адаптация кандидатного каркаса v7; универсальная форма ещё не утверждена", "sections": [{"title": "Logo / Sign Behavior", "text": "В разговоре используется имя Ольга; профиль показывает полное имя. Существующий знак не исследован. Нужность нового логотипа не установлена.", "status": "Открыто", "source": "", "sourceLabel": "", "sources": []}, {"title": "Typography / Color", "text": "Гарнитуры и иерархия не выбраны; ясность чтения — предложенный критерий. Палитра открыта. Не выдаём оформление Atlas MVP за визуальную айдентику Ольги.", "status": "Открыто", "source": "", "sourceLabel": "", "sources": []}, {"title": "Composition / Graphic Language", "text": "Принят понятный порядок с живым присутствием автора. Конкретный узнаваемый графический приём и правила вариативности не разработаны.", "status": "Принято согласно экспресс-сборке; правила — открыто", "source": "", "sourceLabel": "", "sources": []}, {"title": "Imagery / Motion", "text": "Естественные фотографии Ольги — принятое направление. исходники, стиль съёмки, права и оформление видео не проверены.", "status": "Принято согласно экспресс-сборке; готовность — со слов Ольги; активы — открыто", "source": "", "sourceLabel": "", "sources": []}, {"title": "Accessibility / Application Principles", "text": "Предложение: проверить на телефоне представление специалиста, объяснение консультации и путь записи; читаемость, контраст, субтитры там, где нужны. Демонстрационные композиции ещё не создавались. Средства развиваем под выбранный первый опыт, а не задерживаем его ради полного брендбука.", "status": "Предложение — не согласовано", "source": "", "sourceLabel": "", "sources": []}]}, "external.channels": {"title": "Роли каналов", "path": "", "summary": "У Instagram наблюдены два маршрута к Taplink/Telegram и DIKIDI. Рекомендации рассматриваем как иной вход; дальнейший путь этих людей неизвестен. Выбор основного канала зависит от фактических обращений и ограничений.", "templatePath": "", "templateStatus": "Проектная адаптация кандидатного каркаса v7; универсальная форма ещё не утверждена", "sections": [{"title": "Роль Instagram", "text": "Существующий канал знакомства и контакта со слов Ольги; публичный профиль наблюдён. Реальный вклад в новые записи и тип аккаунта неизвестны. Для российской географии не планировать рекламу автоматически; конкретные материалы требуют оценки по содержанию и контексту.", "status": "Со слов Ольги — по экспресс-сборке; наблюдение и ограничения отдельно", "source": "", "sourceLabel": "", "sources": []}, {"title": "Рекомендации", "text": "Возможный самостоятельный источник знакомства. Предлагаем ясную страницу, которую можно самостоятельно открыть или переслать. Не назначаем рассылки клиентам, отзывы и обращения коллегам без конкретного поручения.", "status": "Со слов Ольги — по экспресс-сборке; применение — предложение", "source": "", "sourceLabel": "", "sources": []}, {"title": "Общая точка условий и записи", "text": "Taplink уже содержит описание/цены и Telegram; DIKIDI отдельно даёт самостоятельную запись. Предлагаем проверить их согласованность и назначение для разных входов, не создавать новый сайт автоматически. Рекомендованный человек также может пользоваться этими точками, но такое использование пока не наблюдалось.", "status": "Наблюдение + предложение", "source": "", "sourceLabel": "", "sources": []}, {"title": "Дополнительный поиск", "text": "Кандидаты: Карты либо каталог психологов. Публичный DIKIDI уже указывает очный адрес в Красноярске; право и возможность размещения карточки по этому адресу нужно сверить, как и возможную существующую карточку. Не считать этот канал новым до инвентаризации. Одновременно запускать все кандидаты не требуется.", "status": "Наблюдение + гипотеза канала", "source": "", "sourceLabel": "", "sources": []}, {"title": "Format / Language / Relationship", "text": "Русский язык; визуальное знакомство и объяснение, подробные условия и ответ могут жить в разных средах. Человек не обязан видеть материалы по порядку. Частота и формат выбираются после проверки ресурса и инструментов.", "status": "Предложение — не согласовано", "source": "", "sourceLabel": "", "sources": []}, {"title": "Boundary — граница", "text": "Эта страница хранит роли каналов. Контент-план, SMM-настройки и производство — проект применения. MCP может дать данные и операции; выбор функций и формы остаётся проектной работой.", "status": "Правило хранения; инструментальная гипотеза", "source": "", "sourceLabel": "", "sources": []}]}, "external": {"title": "Коммуникация и айдентика", "path": "", "summary": "Характер и смысл заданы; средства и роли каналов проверяем под задачу записи. MVP Atlas — не айдентика Ольги.", "templatePath": "", "templateStatus": "Проектная адаптация кандидатного каркаса v7; универсальная форма ещё не утверждена", "sections": [{"title": "Текущее положение", "text": "Характер и смысл заданы; средства и роли каналов проверяем под задачу записи. MVP Atlas — не айдентика Ольги.", "status": "Сводка с сохранением статусов в подмодулях", "source": "", "sourceLabel": "", "sources": []}, {"title": "Система сообщений", "text": "Рабочий смысл — учитывать себя в отношениях. Публичные формулировки должны объяснять существующую консультацию, а не обещать одинаковое изменение всем.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}, {"title": "Голос и речь", "text": "Прямо, понятно, тепло и без оценивания человека. Юмор допустим; тон не заменяет точность условий.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}, {"title": "Визуальная система", "text": "Принято направление, а не готовая айдентика: ясность, тепло, порядок, естественные фотографии. Средства предстоит выбрать на реальных применениях.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}, {"title": "Роли каналов", "text": "Instagram — существующий вход, но не единственный кандидат. Общая информация и запись должны помогать также рекомендациям.", "status": "Сводка; источники и статусы в подмодуле", "source": "", "sourceLabel": "", "sources": []}]}}, "availableFiles": []};
var APP_CASE={"title": "Instagram: от Brand Atlas к одному материалу", "date": "2026-09-30", "status": "Внутренний проектный прототип. Не согласован с Ольгой, не снят, не опубликован; восприятие и результат не проверены.", "goal": "Показать конкретному человеку, как Ольга относится к ситуации трудности с отказом, и дать возможность самостоятельно узнать формат консультации. Бизнес-гипотеза — более осмысленные обращения; количественные критерии остаются во внутреннем проекте.", "format": "Один короткий вертикальный разговорный ролик с Ольгой в кадре и читаемыми субтитрами. Формат — гипотеза для проверки; Instagram не обязан состоять только из такого видео.", "medium": {"why": "Instagram уже существует, его публичный профиль проверен. Рекомендации рассматриваются как другой возможный вход. Поэтому Instagram выбран как первый демонстрационный носитель, а не как доказанный главный или единственный канал.", "functions": ["Помочь человеку узнать в теме свою ситуацию без диагноза по посту.", "Показать, как Ольга мыслит и ведёт разговор, чтобы можно было оценить близость её подхода.", "Дать человеку возможность самостоятельно перейти к условиям и способу обращения."], "route": "В профиле уже есть два пути: Taplink с условиями и вопросом в Telegram и DIKIDI с самостоятельной записью. Проверяем, различает ли человек эти варианты; новый сайт не нужен для первого опыта.", "comparison": "Рекомендация может привести человека сразу к Taplink или DIKIDI без Instagram. Дополнительный поисковый вход рассматривается отдельно. Без данных об источниках обращений не назначаем победителя среди каналов.", "success": "Для одного материала сначала проверяем понимание темы, подхода и следующего шага. После применения различаем первый источник знакомства, место обращения, запись и состоявшуюся первую встречу; сопоставляем с внутренними критериями проекта.", "boundary": "Публичная формулировка для Instagram в российской географии требует отдельной проверки по содержанию и контексту. Проектный п    if(!/^(https?:|file:)$/.test(url.protocol))return '';

};
var caseDrawOriginal=draw;
draw=function(){
 caseDrawOriginal();
 var applicationActive=document.getElementById('application-tab').getAttribute('aria-pressed')==='true';
 var applicationRoots={brief:true,audit:true,research:true,core:true,service:true,external:true};
 svg.querySelectorAll('.node').forEach(function(node){
  var id=node.getAttribute('data-id'),n=byId[id];
  node.classList.toggle('case-application-source',applicationActive&&!!applicationRoots[rootOf(id)]);
  node.classList.toggle('case-application-dim',applicationActive&&!applicationRoots[rootOf(id)]);
  node.setAttribute('tabindex','0');
  node.setAttribute('aria-label',caseTitle(n));
  node.setAttribute('aria-pressed',selected===id?'true':'false');
  if(n.children.length)node.setAttribute('aria-expanded',expanded[id]?'true':'false');
 });
};
svg.addEventListener('keydown',function(e){
 var node=e.target.closest('[data-id]');
 if(!node)return;
 if(e.key==='Enter'||e.key===' '){
  e.preventDefault();var id=node.getAttribute('data-id');caseNavigate(id,true);
  var replacement=svg.querySelector('[data-id="'+id+'"]');if(replacement)replacement.focus({preventScroll:true});
 }
});
svg.addEventListener('click',function(e){if(!dragged&&e.target.closest('[data-id]')&&window.matchMedia('(max-width:720px)').matches)inspector.scrollIntoView({behavior:'auto',block:'start'})});
document.querySelector('.topbar h1').textContent='BRAND ATLAS · ОЛЬГА';
document.querySelector('.topbar p').textContent=publicMode?'Основания → решения → применение':'Интервью → основания → применение';
document.querySelector('.side-footer').innerHTML=publicMode?'Демонстрационная сборка · только для чтения':'Записи только для чтения · <a href="#">план проекта</a>';
document.getElementById('reset').textContent='Обзор';
document.getElementById('detail-tab').textContent='Проект';
document.getElementById('methods-tab').textContent='Методы';
document.getElementById('platform-tab').textContent='Платформа';
document.getElementById('outputs-tab').textContent='Материалы';
document.getElementById('application-tab').onclick=showApplication;
document.getElementById('zoom-out').setAttribute('aria-label','Уменьшить карту');
document.getElementById('zoom-in').setAttribute('aria-label','Увеличить карту');
document.getElementById('catalog-tab').onclick=function(){
 setTab('catalog');selected=null;draw();
 inspector.innerHTML='<h2>Карта проекта</h2><div class="kind-line"><span>7 направлений · 29 модулей</span></div>'+SCHEMA.roots.map(function(r){return '<button class="catalog-item" data-select="'+esc(r.id)+'"><strong>'+esc(caseTitle(r))+'</strong><small>'+esc(r.title)+'</small></button><div class="case-catalog-children">'+r.children.map(function(n){return '<button class="catalog-item" data-select="'+esc(n.id)+'">'+esc(caseTitle(n))+'</button>'}).join('')+'</div>'}).join('');wireSelects();inspector.scrollTop=0;
};
var caseSearchOld=document.getElementById('search'),caseSearch=caseSearchOld.cloneNode(true);
caseSearchOld.replaceWith(caseSearch);
caseSearch.placeholder='Найти в проекте';caseSearch.setAttribute('aria-label','Найти модуль или содержание проекта');
caseSearch.addEventListener('input',function(){
 var q=this.value.trim().toLocaleLowerCase('ru');
 if(!q){showPanel();return}
 setTab('detail');
 var found=all.filter(function(n){var r=caseRecords[n.id];return [n.title,caseLabels[n.id]||'',r.title,r.summary].concat(r.sections.map(function(s){return s.title+' '+s.text})).join(' ').toLocaleLowerCase('ru').indexOf(q)!==-1});
 inspector.innerHTML='<h2>Поиск</h2><div class="kind-line"><span>Найдено модулей: '+found.length+'</span></div>'+found.map(function(n){var r=caseRecords[n.id];return '<button class="catalog-item" data-select="'+esc(n.id)+'">'+esc(r.title)+'<small>'+esc(r.summary)+'</small></button>'}).join('')+(found.length?'':'<p class="case-empty">Совпадений нет. Попробуйте другое слово или откройте карту модулей.</p>');wireSelects();inspector.scrollTop=0;
});
['methods','platform','outputs'].forEach(function(name){document.getElementById(name+'-tab').onclick=function(){showSystem(name);draw();inspector.scrollTop=0}});
if(publicMode){document.getElementById('methods-tab').remove();document.getElementById('outputs-tab').remove();document.body.classList.add('case-public')}

try{reset();stateEl.textContent='7 модулей'}catch(err){stateEl.textContent='Ошибка интерактивного режима';console.error(err);showPanel()}
})();
</script></body></html>
